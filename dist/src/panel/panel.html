<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Crate Goblin</title>
  <style>
    /* Guard against loading the source folder instead of dist/.
       Both have a manifest.json, so Chrome accepts either — but here
       panel.html points at raw main.jsx, which Chrome refuses as
       application/octet-stream, and the panel just comes up blank with the
       real reason buried in chrome://extensions.

       React replaces #root's children on mount, so in a real build this never
       becomes visible. The delay is what makes that true without any script:
       if the module loaded, the node is gone long before the fade starts. */
    .load-guard {
      opacity: 0;
      animation: guard-in 0s linear 1.2s forwards;
      margin: 0; padding: 34px 40px;
      font: 15px/1.6 ui-serif, Georgia, serif;
      color: #1d1219; background: #f6edf0;
    }
    @keyframes guard-in { to { opacity: 1; } }
    .load-guard code {
      font-family: ui-monospace, Menlo, monospace;
      background: #f0d8e4; padding: 2px 6px;
    }
  </style>
  <script type="module" crossorigin src="/assets/panel.html.BUMdZqIl.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/triage.oUhnJCBF.js">
  <link rel="modulepreload" crossorigin href="/assets/api.DVVKyAWW.js">
  <link rel="modulepreload" crossorigin href="/assets/paths.DeZ9bFSf.js">
  <link rel="stylesheet" crossorigin href="/assets/panel-DgJwhyNA.css">
</head>
<body>
  <div id="root">
    <div class="load-guard">
      <p><strong>This is the source folder, not the build.</strong></p>
      <p>Run <code>bun run build</code>, then load <code>dist/</code> in
         <code>chrome://extensions</code> instead of the project root.</p>
    </div>
  </div>
</body>
</html>
